<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>URL Shortener — Test UI</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  form { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
  input { padding: 0.5rem; border: 1px solid #8888; border-radius: 4px; font-size: 0.95rem; }
  input[name="url"] { flex: 1 1 300px; }
  input[name="customAlias"] { flex: 0 1 160px; }
  input[name="expiresAt"] { flex: 0 1 200px; }
  button { padding: 0.5rem 1rem; border: 0; border-radius: 4px; background: #2563eb; color: white; cursor: pointer; font-size: 0.95rem; }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #6b7280; }
  button.danger { background: #dc2626; }
  #message { min-height: 1.4rem; margin-bottom: 1rem; font-size: 0.9rem; }
  #message.error { color: #dc2626; }
  #message.ok { color: #16a34a; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #8884; vertical-align: top; }
  td.actions { white-space: nowrap; }
  code { background: #8882; padding: 0.1rem 0.3rem; border-radius: 3px; }
  .muted { opacity: 0.65; font-size: 0.85rem; }
  .stats-box { white-space: pre-wrap; font-size: 0.8rem; background: #8881; padding: 0.5rem; border-radius: 4px; margin-top: 0.25rem; }
  .inactive { opacity: 0.5; text-decoration: line-through; }
</style>
</head>
<body>
  <h1>URL Shortener — Test UI</h1>
  <p class="muted">Talks directly to this server's own API (<code>/api/urls</code>). For manual/exploratory testing, not part of the production API surface.</p>

  <form id="create-form">
    <input name="url" type="url" placeholder="https://example.com/very/long/path" required />
    <input name="customAlias" type="text" placeholder="custom alias (optional)" pattern="[A-Za-z0-9_\-]{3,32}" title="3-32 chars: letters, digits, _ or -" />
    <input name="expiresAt" type="datetime-local" title="expires at (optional)" />
    <button type="submit">Shorten</button>
  </form>
  <div id="message"></div>

  <table>
    <thead>
      <tr><th>Code</th><th>Long URL</th><th>Created</th><th>Expires</th><th>Actions</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

<script src="app.js" defer></script>
</body>
</html>
