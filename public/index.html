<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>URL Shortener — Dashboard</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="mark">🔗</div>
    <div>
      <h1>URL Shortener</h1>
      <p>Link management &amp; click analytics</p>
    </div>
  </header>

  <section class="stats-row">
    <div class="stat-card">
      <span class="stat-label">Total Links</span>
      <span class="stat-value" id="stat-total">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Active Links</span>
      <span class="stat-value" id="stat-active">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Total Clicks</span>
      <span class="stat-value" id="stat-clicks">—</span>
    </div>
  </section>

  <section class="card">
    <h2>Create a short link</h2>
    <form id="create-form" class="create">
      <div class="field grow">
        <label for="url">Destination URL</label>
        <input id="url" name="url" type="url" placeholder="https://example.com/very/long/path" required />
      </div>
      <div class="field fixed-alias">
        <label for="customAlias">Custom alias</label>
        <input id="customAlias" name="customAlias" type="text" placeholder="optional" pattern="[A-Za-z0-9_\-]{3,32}" title="3-32 chars: letters, digits, _ or -" />
      </div>
      <div class="field fixed-date">
        <label for="expiresAt">Expires at</label>
        <input id="expiresAt" name="expiresAt" type="datetime-local" />
      </div>
      <div class="field fixed-alias">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="optional" minlength="4" maxlength="72" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn">Shorten</button>
    </form>
    <div id="message" class="banner"></div>
  </section>

  <section class="card">
    <div class="card-header">
      <h2>Links</h2>
      <label class="toggle"><input type="checkbox" id="toggle-inactive" /> Show deleted</label>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Short Link</th>
            <th>Destination</th>
            <th>Status</th>
            <th>Clicks</th>
            <th>Created</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="empty-state" hidden>
      <span class="glyph">🔗</span>
      No links yet — create one above to get started.
    </div>
    <div id="loading" class="skeleton">Loading…</div>
  </section>

</div>
<script src="app.js" defer></script>
</body>
</html>
